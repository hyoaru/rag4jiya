services:
  vector_database_qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: rag4jiya_vector_database_qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - rag4jiya_vector_database_qdrant_data_volume:/qdrant/storage/

  database_postgres:
    image: postgres:17-bookworm
    container_name: rag4jiya_database_postgres
    environment:
      POSTGRES_PASSWORD: rag4jiya
      POSTGRES_DB: rag4jiya
    ports:
      - "5432:5432"
    volumes:
      - rag4jiya_database_postgres_data_volume:/var/lib/postgresql/data

  s3_minio:
    image: minio/minio:latest
    container_name: rag4jiya_s3_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - rag4jiya_s3_minio_data_volume:/data
    command: server /data --console-address ":9001"

volumes:
  rag4jiya_vector_database_qdrant_data_volume:
  rag4jiya_database_postgres_data_volume:
  rag4jiya_s3_minio_data_volume:
